name: provision-credential

# One-off: issue a Renown delegation credential from this repository's
# publisher wallet to the CI app DID, so the registry authorizes its publishes.
# Re-run near expiry — the release job fails loudly at its whoami pre-flight
# when the credential is missing, expired or revoked.

on:
  workflow_dispatch:
    inputs:
      switchboard_url:
        description: Switchboard graphql endpoint the registry's Renown reads from
        required: true
        default: https://switchboard.renown.vetra.io/graphql
      expires_days:
        description: Credential lifetime in days
        required: true
        default: "365"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Guard secrets
        env:
          WALLET_KEY: ${{ secrets.REGISTRY_WALLET_KEY }}
          RENOWN_KEY: ${{ secrets.REGISTRY_RENOWN_KEY }}
        run: |
          for s in WALLET_KEY RENOWN_KEY; do
            [ -n "${!s}" ] || { echo "::error::secret REGISTRY_$s is not set"; exit 1; }
          done

      - name: Issue and store credential
        env:
          REGISTRY_WALLET_KEY: ${{ secrets.REGISTRY_WALLET_KEY }}
          PH_RENOWN_PRIVATE_KEY: ${{ secrets.REGISTRY_RENOWN_KEY }}
          PH_RENOWN_SWITCHBOARD_URL: ${{ inputs.switchboard_url }}
          PH_RENOWN_EXPIRES_DAYS: ${{ inputs.expires_days }}
        run: node scripts/publish/provision-credential.mjs
