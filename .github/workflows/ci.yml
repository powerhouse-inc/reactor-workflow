name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes the run in flight. Every commit on main still
# gets its own run, so a regression is always attributed to one commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline

      # Build first: every piece's conformance gate loads what the build
      # emitted, so an unbuilt workspace would skip the only test that says
      # the published artifact works.
      - run: pnpm run build
      - run: pnpm run tsc
      - run: pnpm run lint
      - run: pnpm -r --no-sort --workspace-concurrency=2 exec vitest run
