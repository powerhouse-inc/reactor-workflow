packages:
  - "packages/*"

allowBuilds:
  '@apollo/protobufjs': false
  '@datadog/pprof': false
  '@parcel/watcher': false
  '@reown/appkit': false
  bufferutil: false
  esbuild: false
  keccak: false
  protobufjs: false
  utf-8-validate: false
# The Powerhouse packages publish under the `dev` tag several times a day, so
# a release-age floor would make every one of them unresolvable.
minimumReleaseAgeExclude:
  - '@powerhousedao/*'
  - '@renown/*'
  - document-model
