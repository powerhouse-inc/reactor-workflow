# A throwaway paperless-ngx for the live suite in e2e.test.ts.
#
# Host networking is deliberate: the webhook test needs paperless to POST back
# to a listener the test process owns, and on a bridge network that means
# host.docker.internal, which many hosts drop at the firewall. On the host
# netns both directions are plain loopback. The ports are non-default so this
# never collides with a real paperless on 8000/6379.
#
# The project name and volumes are explicit so this stack can run alongside
# e2e-legacy-compose.yml, which lives in the same directory: without them
# both files share the project name `test` and the second `up -d` recreates
# the first stack's webserver on top of it.
#
#   docker compose -f test/e2e-compose.yml up -d
#   PAPERLESS_E2E_URL=http://localhost:18000 pnpm vitest run test/e2e.test.ts
#   docker compose -f test/e2e-compose.yml down -v
#
# No PAPERLESS_DBHOST: this image then runs on its bundled SQLite in the data
# volume, which keeps the whole stack in one container.
name: paperless-e2e
services:
  broker:
    image: docker.io/library/redis:7
    network_mode: host
    command: ["redis-server", "--port", "16379"]
    restart: unless-stopped

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    network_mode: host
    depends_on:
      - broker
    environment:
      PAPERLESS_PORT: "18000"
      PAPERLESS_REDIS: redis://localhost:16379
      PAPERLESS_URL: http://localhost:18000
      PAPERLESS_TIME_ZONE: UTC
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: paperless-e2e
      PAPERLESS_ADMIN_MAIL: admin@example.com
      # Required since 3.x; any value works for a throwaway instance.
      PAPERLESS_SECRET_KEY: e2e-only-not-a-real-secret
      # The delivery target is loopback, which counts as internal.
      PAPERLESS_WEBHOOKS_ALLOW_INTERNAL_REQUESTS: "true"
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "1"
    volumes:
      # Named (not the image's anonymous volumes) so a recreation by the
      # neighbouring project can never resurrect another stack's database.
      - paperless-e2e-data:/usr/src/paperless/data
      - paperless-e2e-media:/usr/src/paperless/media
      - paperless-e2e-consume:/usr/src/paperless/consume
      - paperless-e2e-export:/usr/src/paperless/export

volumes:
  paperless-e2e-data:
  paperless-e2e-media:
  paperless-e2e-consume:
  paperless-e2e-export:
