# A pre-3.0 paperless for e2e-legacy.test.ts. Its API tops out at version 9,
# which is what makes it worth running: a client that pinned version 10 would
# 406 on every request, and its task rows use Celery's uppercase states with a
# string `related_document`.
#
#   docker compose -f test/e2e-legacy-compose.yml up -d
#   PAPERLESS_LEGACY_E2E_URL=http://localhost:18001 \
#   pnpm vitest run test/e2e-legacy.test.ts
#   docker compose -f test/e2e-legacy-compose.yml down -v
#
# A bridge network is fine here: this half never receives a webhook, so it
# needs no route back to the test process.
#
# The project name and volumes are explicit so this stack can run alongside
# e2e-compose.yml, which lives in the same directory: without them both files
# share the project name `test` and the second `up -d` recreates the first
# stack's webserver on top of it. The image bundles its own postgres, which
# lives in the data volume below.
name: paperless-legacy-e2e
services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.18.4
    depends_on:
      - broker
    ports:
      - "18001:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_SECRET_KEY: e2e-only-not-a-real-secret
      PAPERLESS_URL: http://localhost:18001
      PAPERLESS_TIME_ZONE: UTC
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: paperless-e2e
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "1"
    volumes:
      # Named (not the image's anonymous volumes) so a recreation by the
      # neighbouring project can never resurrect another stack's database.
      - paperless-legacy-e2e-data:/usr/src/paperless/data
      - paperless-legacy-e2e-media:/usr/src/paperless/media
      - paperless-legacy-e2e-consume:/usr/src/paperless/consume
      - paperless-legacy-e2e-export:/usr/src/paperless/export

volumes:
  paperless-legacy-e2e-data:
  paperless-legacy-e2e-media:
  paperless-legacy-e2e-consume:
  paperless-legacy-e2e-export:
