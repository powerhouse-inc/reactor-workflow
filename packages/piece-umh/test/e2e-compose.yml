# The floor this piece was built against, on its own, for the live suite:
#
#   docker compose -f packages/piece-umh/test/e2e-compose.yml up -d
#   UMH_E2E_URL=http://localhost:18081 pnpm -F @powerhousedao/piece-umh vitest run test/e2e.test.ts
#   docker compose -f packages/piece-umh/test/e2e-compose.yml down
#
# One container: the simulator holds the machines, the fake MES that dispatches
# orders to them, and the REST API the piece reads. umh-core, TimescaleDB and
# Grafana are deliberately absent — nothing this piece touches lives there.
#
# Port 18081, not the canonical 8081: a real ~/umh-factory deployment (or the
# umh-powerhouse demo) publishes 8081, and a test must not talk to someone's
# running factory by accident.
#
# SIMULATOR_PROFILE is required — the image exits immediately without one.
# SIMULATOR_ERP_MODE=manual stops its fake ERP minting an order every 30
# seconds, so the only orders on this floor are the ones the suite creates.
name: umh-piece-e2e

services:
  machine-simulator:
    image: dh2k/machine-simulator-2:v1.1.0
    ports:
      - "18081:8081"
    environment:
      SIMULATOR_PROFILE: demo-mixed
      SIMULATOR_ERP_MODE: manual
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
